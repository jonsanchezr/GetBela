# =============================================================================
# nginx del frontend de GetBela en produccion.
#
# Sirve el build estatico de Vite (dist/) con dos reglas:
#
#   1. Los assets (/assets/...) llevan hash en el nombre, asi que se pueden
#      cachear para siempre: el contenido cambia solo si cambia el hash.
#
#   2. Todo lo demas cae en index.html (SPA fallback). Es lo que necesita
#      una SPA con enrutado del lado del cliente: /servicio/12 no es un
#      archivo del disco, es una ruta que resuelve el router del navegador.
#      Sin este fallback, recargar en una ruta interna daria 404.
#
# index.html se manda sin cache para que un deploy nuevo se vea de inmediato:
# es el archivo que referencia los assets con hash.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;

    # Compresion de los recursos de texto.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml font/woff font/woff2;

    # -------------------------------------------------------------------------
    # Assets con hash: cache inmutable.
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # index.html: siempre revalidado.
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # -------------------------------------------------------------------------
    # SPA fallback.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No se exponen los archivos ocultos.
    location ~ /\. {
        deny all;
    }

    # Health check: no deja que el proxy lo cachee.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
