# =============================================================================
# nginx del contenedor backend de GetBela.
#
# Sirve el backend Laravel 13:
#
#   /            -> try_files -> si no esta en disco, /index.php
#   *.php        -> fastcgi_pass 127.0.0.1:9000  (php-fpm)
#   estaticos    -> servidos del disco, sin pasar por PHP
#
# El document root es /var/www/html/public (el de Laravel).
# =============================================================================

user  hostuser;
worker_processes  auto;

# The logs go to stdout/stderr so `docker logs` collects them, and the pid
# file goes to /tmp: the container runs as hostuser (uid 1000) and cannot
# write to /var/run, so nginx would abort with
# "open() /var/run/nginx.pid failed (13: Permission denied)".
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64m;

    # El backend recibe peticiones del frontend en otro puerto (5173) y del
    # host. No hay proxy inverso en este grupo, pero se desactivan los headers
    # que solo tienen sentido con uno.
    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length  1024;

    server {
        listen  80 default_server;
        server_name  _;

        root  /var/www/html/public;
        index  index.php index.html;

        # Archivos de Laravel: no se sirven directamente (contienen codigo).
        location ~ /\. {
            deny  all;
        }

        # Los assets compilados por Vite viven en public/build.
        location /build/ {
            try_files $uri =404;
            expires 1h;
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;

            # Timeouts alineados con max_execution_time del PHP.
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }
}
