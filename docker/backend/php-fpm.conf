; =============================================================================
; php-fpm del contenedor backend de GetBela.
;
; Sobreescribe el www.conf por defecto, que escucha en 0.0.0.0:9000
; (alcanzable desde la red Docker). Este lo limita a loopback: solo el nginx
; de este contenedor puede hablarle.
; =============================================================================
[www]
user = hostuser
group = hostgroup

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Los errores van a stderr: el contenedor los recoge en `docker logs`.
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
