; =============================================================================
; supervisor del contenedor backend de GetBela.
;
; Arranca los dos procesos del contenedor:
;   nginx    -> :80             (HTTP, el que resuelve la ruta)
;   php-fpm  -> 127.0.0.1:9000  (FastCGI, solo loopback)
; =============================================================================
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
; The pid file goes to /tmp: the container runs as hostuser (uid 1000) and
; cannot write to /var/run, so supervisor would log
; "CRIT could not write pidfile /var/run/supervisord.pid".
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
