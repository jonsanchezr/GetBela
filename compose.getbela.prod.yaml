# =============================================================================
# GetBela - GRUPO GETBELA (produccion, VPS)
#
# Variante del compose de desarrollo (compose.getbela.yaml) para correr en
# el VPS detrás de Traefik, bajo el dominio https://getbela.syrexsoftware.com
#
# -----------------------------------------------------------------------------
# QUE CAMBIA RESPECTO DE DESARROLLO
#
#   1. El frontend NO es el dev-server de Vite: es un build estatico de
#      produccion servido por nginx (docker/frontend/Dockerfile.prod). El
#      dev-server con HMR no es apto para un sitio publico.
#
#   2. El codigo NO viaja por bind mount desde una maquina de desarrollo:
#      el backend recibe el repo clonado (ruta ./app) y el frontend lo
#      compila dentro de la imagen durante el build.
#
#   3. Los puertos publicados son los INTERNOS de cada servicio. Traefik
#      enruta por la red del grupo: no hace falta publicar nada en el host.
#      Publicarlos ademas abriria el backend y el MySQL a internet.
#
#   4. CORS y Sanctum apuntan al dominio real, no a localhost:5173.
#
#   5. APP_ENV=production y APP_DEBUG=false: en produccion un error no debe
#      filtrar el stack trace al navegador.
#
# -----------------------------------------------------------------------------
# REQUISITOS DEL HOST
#
#   - Docker y Docker Compose v2
#   - El codigo clonado en ./app (el backend usa ese codigo)
#   - Un .env con los secretos (ver .env.example)
#
# -----------------------------------------------------------------------------
# OPERACION
#
#   docker compose -f compose.getbela.prod.yaml up -d --build
#   docker compose -f compose.getbela.prod.yaml ps
#   docker compose -f compose.getbela.prod.yaml logs -f backend
#   docker compose -f compose.getbela.prod.yaml down
#
# Para actualizar el codigo:
#
#   cd app && git pull && cd ..
#   docker compose -f compose.getbela.prod.yaml up -d --build
# =============================================================================

name: getbela

services:
  # ---------------------------------------------------------------------
  # mysql : base de datos propia de GetBela
  #
  # MySQL 8.4 LTS. Es independiente del MySQL 5.7 de docker-windows: este
  # contenedor no comparte volumenes, redes ni credenciales con aquel stack.
  # ---------------------------------------------------------------------

  mysql:
    # La variante Debian, no la de Alpine.
    #
    # MySQL 8.4 y 8.0 (glibc) exigen CPU x86-64-v2 (SSE4.2 y POPCNT) y
    # abortan con "Fatal glibc error: CPU does not support x86-64-v2" en
    # servidores con CPU emulada basica. La build Debian de 8.0 esta
    # compilada con un baseline mas bajo y funciona en esa CPU.
    image: mysql:8.0-debian
    container_name: getbela-mysql
    hostname: mysql
    restart: unless-stopped
    command:
      # Settings as command flags: a bind-mounted config file would be
      # reported as world-writable (777) by Docker Desktop on Windows, and
      # MySQL silently ignores world-writable config files.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # MySQL 8.0 usa `default-authentication-plugin` (8.4 lo elimino y lo
      # reemplazo por `--mysql-native-password=ON`, que en 8.0 no existe).
      #
      # caching_sha2_password (el default de 8.0) no lo soporta el build
      # pdo_mysql de PHP 8.3 que usa el cliente de Laravel, asi que el
      # plugin legado se habilita explicitamente.
      - --default-authentication-plugin=mysql_native_password
      - --explicit-defaults-for-timestamp=1
      - --max-allowed-packet=64M
      - --max-connections=200
      - --slow-query-log=1
      - --long-query-time=2
    environment:
      MYSQL_ROOT_PASSWORD: ${GETBELA_MYSQL_ROOT_PASSWORD:?GETBELA_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${GETBELA_DB_DATABASE:-getbela}
      MYSQL_USER: ${GETBELA_DB_USERNAME:-getbela}
      MYSQL_PASSWORD: ${GETBELA_DB_PASSWORD:?GETBELA_DB_PASSWORD is required}
      TZ: ${TZ:-America/Santiago}
      # El script de inicializacion (docker/mysql/init/01-create-getbela-db.sql)
      # usa @GETBELA_DB_PASSWORD para fijar la password del usuario. MySQL
      # resuelve esa variable desde el entorno del proceso, asi que tiene que
      # estar presente en el contenedor aunque no la use la imagen oficial.
      GETBELA_DB_PASSWORD: ${GETBELA_DB_PASSWORD:?GETBELA_DB_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-logs:/var/log/mysql
      # SQL scripts here run once, on first initialization of an empty datadir.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      getbela:
        aliases:
          - mysql
          - db
    # NO se publica ningun puerto: el MySQL no se expone al host ni a
    # internet. Solo es alcanzable desde la red del grupo.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------------
  # backend : API Laravel 13 (PHP 8.3 + nginx + php-fpm)
  #
  # El codigo viene del repo clonado en ./app/backend, montado en
  # /var/www/html. El entrypoint se encarga de composer install, APP_KEY,
  # permisos, migraciones y seeds.
  # ---------------------------------------------------------------------

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    image: getbela/backend:prod
    container_name: getbela-backend
    hostname: backend
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]
    # The `command` is mandatory: without it the entrypoint receives an empty
    # list and `exec "$@"` starts nothing (the container enters a restart loop).
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    volumes:
      # Codigo de la aplicacion (repo clonado). Read-write: Laravel escribe
      # vistas compiladas, cache de archivos y logs.
      - ./app/backend:/var/www/html
      - ./docker/backend/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      APP_NAME: GetBela
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://getbela.syrexsoftware.com
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_LIFETIME: 120
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${GETBELA_DB_DATABASE:-getbela}
      DB_USERNAME: ${GETBELA_DB_USERNAME:-getbela}
      DB_PASSWORD: ${GETBELA_DB_PASSWORD:?GETBELA_DB_PASSWORD is required}
      # Frontend y API comparten el dominio, asi que el origen es el mismo
      # en ambos casos. El CORS queda como red de seguridad: si el frontend
      # se sirve en otro origen, hay que agregar ese origen aqui.
      CORS_ALLOWED_ORIGINS: https://getbela.syrexsoftware.com
      # Sanctum stateful domains, for the SPA session cookies.
      SANCTUM_STATEFUL_DOMAINS: getbela.syrexsoftware.com
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: hello@example.com
      MAIL_FROM_NAME: ${APP_NAME:-GetBela}
      TZ: ${TZ:-America/Santiago}
      # Corre los seeds (datos de prueba) en el arranque. Se desactiva con
      # GETBELA_RUN_SEEDS=false cuando la base ya tiene datos de prueba.
      GETBELA_RUN_SEEDS: ${GETBELA_RUN_SEEDS:-true}
    networks:
      getbela:
        aliases:
          - backend
          - backend.docker
      # Red de Dokploy: es la que Traefik usa para enrutar los dominios.
      # El servicio se publica en las dos redes, igual que hace Dokploy con
      # sus propios composes.
      dokploy-network:
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.getbela-backend.rule: Host(`getbela.syrexsoftware.com`) && PathPrefix(`/api`) || Host(`getbela.syrexsoftware.com`) && PathPrefix(`/sanctum`) || Host(`getbela.syrexsoftware.com`) && PathPrefix(`/storage`)
      traefik.http.routers.getbela-backend.entrypoints: websecure
      traefik.http.routers.getbela-backend.tls.certresolver: letsencrypt
      traefik.http.routers.getbela-backend.service: getbela-backend
      traefik.http.services.getbela-backend.loadbalancer.server.port: "80"
    # Puerto interno del nginx del contenedor. Traefik enruta hacia aca.
    expose:
      - "80"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Laravel's own health route (/up), registered in bootstrap/app.php.
      # `--spider` does not follow redirects and fails on a 404 or a dead
      # service, which is exactly what we want to measure.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------
  # frontend : React 19 + Vite 8 compilado para produccion
  #
  # El build corre DENTRO de la imagen (etapa build del Dockerfile.prod):
  # no hay bind mount del codigo, porque taparia el node_modules que
  # instala la propia imagen.
  #
  # El codigo se copia desde ./app/frontend en el contexto de build.
  # ---------------------------------------------------------------------

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        # La base de la API se deja vacia: el frontend y la API comparten el
        # dominio, y las rutas del codigo ya incluyen el prefijo /api. Con
        # "/api" se produciria /api/api/... (prefijo duplicado).
        VITE_API_URL: ""
    image: getbela/frontend:prod
    container_name: getbela-frontend
    hostname: frontend
    restart: unless-stopped
    networks:
      getbela:
        aliases:
          - frontend
          - frontend.docker
      # Red de Dokploy: es la que Traefik usa para enrutar los dominios.
      dokploy-network:
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      # El frontend sirve la SPA en la raiz. Las rutas /api, /sanctum y
      # /storage las toma el backend, asi que se excluyen de forma explicita:
      # sin esto, este router (que matchea cualquier Host) se quedaria con
      # las peticiones de la API y responderia con el index.html de la SPA
      # en lugar de la respuesta JSON.
      traefik.http.routers.getbela-frontend.rule: Host(`getbela.syrexsoftware.com`) && !PathPrefix(`/api`) && !PathPrefix(`/sanctum`) && !PathPrefix(`/storage`)
      traefik.http.routers.getbela-frontend.entrypoints: websecure
      traefik.http.routers.getbela-frontend.tls.certresolver: letsencrypt
      traefik.http.routers.getbela-frontend.service: getbela-frontend
      traefik.http.services.getbela-frontend.loadbalancer.server.port: "80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # The group's own network. Owned and created by this project only.
  getbela:
    name: getbela
    driver: bridge
  # Red de Dokploy (Swarm). Traefik la usa para enrutar los dominios, asi que
  # el frontend y el backend tienen que estar en ella.
  #
  # Se declara como externa porque la crea y administra Dokploy: este compose
  # solo se conecta. Si no existiera, habria que crearla antes con
  # `docker network create dokploy-network`.
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  mysql-data:
    name: getbela-mysql-data
  mysql-logs:
    name: getbela-mysql-logs
